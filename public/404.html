<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | TechnoEdge</title>
    <meta name="description" content="The requested TechnoEdge page could not be found." />
    <meta name="robots" content="noindex, follow" />
    <style>
      :root { font-family: Inter, Arial, sans-serif; color: #111827; background: #f8fbff; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 40rem; text-align: center; background: white; border: 1px solid rgba(1,38,106,.14); border-radius: 1.25rem; padding: clamp(2rem,6vw,4rem); box-shadow: 0 20px 60px rgba(1,38,106,.08); }
      p:first-child { color: #01266a; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: .5rem 0 1rem; font-size: clamp(2rem,6vw,3.5rem); }
      p { line-height: 1.7; color: #4b5563; }
      a { display: inline-block; margin-top: 1.25rem; padding: .85rem 1.2rem; border-radius: .65rem; background: #01266a; color: white; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #73c2fb; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>404 error</p>
      <h1>Page not found</h1>
      <p>The page may have moved, been retired, or the address may be incorrect.</p>
      <a href="/">Go to TechnoEdge home</a>
    </main>
  </body>
</html>
